name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve eXeLearning editor ref
        id: editor
        run: |
          if [ -f .editor-version ]; then
            REF=$(cat .editor-version | tr -d '[:space:]')
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Download eXeLearning editor
        env:
          EXELEARNING_EDITOR_REF: ${{ steps.editor.outputs.ref }}
        run: make download-editor

      - name: Build
        run: npm run build
        env:
          VITE_MS_CLIENT_ID: ${{ secrets.VITE_MS_CLIENT_ID || vars.VITE_MS_CLIENT_ID }}
          VITE_MS_TENANT: ${{ secrets.VITE_MS_TENANT || vars.VITE_MS_TENANT }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
